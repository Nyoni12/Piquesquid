  <script type="text/javascript">
  // Make the ribbon draggable
  document.addEventListener('DOMContentLoaded', function() {
    const ribbon = document.getElementById('translateRibbon');
    let isDragging = false;
    let offsetX, offsetY;

    // Handle for dragging
    const dragHandle = ribbon.querySelector('.drag-handle');
    
    dragHandle.addEventListener('mousedown', function(e) {
      isDragging = true;
      offsetX = e.clientX - ribbon.getBoundingClientRect().left;
      offsetY = e.clientY - ribbon.getBoundingClientRect().top;
      ribbon.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      
      const x = e.clientX - offsetX;
      const y = e.clientY - offsetY;
      
      // Constrain to viewport
      const maxX = window.innerWidth - ribbon.offsetWidth;
      const maxY = window.innerHeight - ribbon.offsetHeight;
      
      ribbon.style.left = Math.min(Math.max(0, x), maxX) + 'px';
      ribbon.style.top = Math.min(Math.max(0, y), maxY) + 'px';
      ribbon.style.right = 'auto';
      ribbon.style.transform = 'none';
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
      ribbon.style.cursor = '';
      
      // Save position to localStorage
      localStorage.setItem('translateRibbonPos', JSON.stringify({
        left: ribbon.style.left,
        top: ribbon.style.top
      }));
    });

    // Set default position (right center) if no saved position exists
    function setDefaultPosition() {
      const verticalCenter = (window.innerHeight - ribbon.offsetHeight) / 2;
      ribbon.style.right = '20px';
      ribbon.style.top = verticalCenter + 'px';
      ribbon.style.left = 'auto';
      ribbon.style.transform = 'none';
    }

    // Load saved position or set default
    const savedPos = localStorage.getItem('translateRibbonPos');
    if (savedPos) {
      const pos = JSON.parse(savedPos);
      ribbon.style.left = pos.left;
      ribbon.style.top = pos.top;
      ribbon.style.right = 'auto';
      ribbon.style.transform = 'none';
    } else {
      setDefaultPosition();
    }

    // Reset to default position on double-click
    dragHandle.addEventListener('dblclick', function() {
      localStorage.removeItem('translateRibbonPos');
      setDefaultPosition();
    });

    // Recalculate position on window resize
    window.addEventListener('resize', function() {
      if (!savedPos) {
        setDefaultPosition();
      }
    });

    // Initialize Google Translate with ALL languages
    window.googleTranslateElementInit = function() {
      try {
        new google.translate.TranslateElement(
          { 
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
            includedLanguages: '', // Empty string shows ALL languages
            gaTrack: true
          },
          'google_translate_element'
        );

        // Fix for language dropdown width
        setTimeout(function() {
          const select = document.querySelector('.goog-te-combo');
          if (select) {
            select.style.width = 'auto';
            select.style.minWidth = '180px';
          }
        }, 1000);
      } catch(e) {
        console.error('Google Translate initialization failed:', e);
      }
    };

    // Load Google Translate script
    const script = document.createElement('script');
    script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    script.type = 'text/javascript';
    document.body.appendChild(script);
  });
</script>
